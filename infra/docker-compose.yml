# Regtest stack, based on RGB-Tools/rgb-lightning-node@d4762ac compose.yaml.
# Changes vs upstream: esplora on host port 3010 (3002 is Bob's node), named volumes,
# explicit amd64 platform for amd64-only images, four RLN nodes as services, and every
# published port bound to 127.0.0.1 (SPEC §13 #13). Never point this at mainnet.
name: kitty

x-rln: &rln
  image: settleup/rln:d4762ac
  depends_on:
    - bitcoind
    - electrs
    - proxy
  restart: unless-stopped

services:
  bitcoind:
    image: registry.gitlab.com/hashbeam/docker/bitcoind:30.2
    platform: linux/amd64
    command: "-fallbackfee=0.0002"
    environment:
      MYUID: 1000
      MYGID: 1000
      # rpc user "user", password "password" (same as upstream, regtest only)
      RPCAUTH: "user:84c66d54d736d8b02aaa5b02e07e759b$$cc56c229b2a49ae2bfd5932cc8a6135d435bb9a7ac037ddd351d65936082c03d"
    ports:
      - 127.0.0.1:18443:18443
    volumes:
      - bitcoind:/srv/app/.bitcoin

  electrs:
    image: registry.gitlab.com/hashbeam/docker/electrs:0.11.0
    platform: linux/amd64
    environment:
      MYUID: 1000
      MYGID: 1000
      BTCPASS: "password"
    volumes:
      - electrs:/srv/app/db
    depends_on:
      - bitcoind
    ports:
      - 127.0.0.1:50001:50001

  # Esplora REST API only (no web UI). Its electrum RPC stays inside the container;
  # the 0.0.0.0 below is the in-container listen address, not a published port.
  esplora:
    image: blockstream/esplora@sha256:ef092138f7fcd5f3988441adf056632d64a7b95908896c471355c750a18f4541  # latest as of 2026-10-14
    entrypoint: []
    command: >
      /srv/explorer/electrs_bitcoin/bin/electrs
      --timestamp
      --network regtest
      --jsonrpc-import
      --cookie user:password
      --daemon-rpc-addr bitcoind:18443
      --http-addr 0.0.0.0:3002
      --electrum-rpc-addr 0.0.0.0:60401
      --db-dir /data/db
      --cors '*'
    volumes:
      - esplora:/data
    depends_on:
      - bitcoind
    ports:
      - 127.0.0.1:3010:3002

  proxy:
    image: ghcr.io/rgb-tools/rgb-proxy-server:0.3.0
    platform: linux/amd64
    ports:
      - 127.0.0.1:3000:3000

  rln-alice:
    <<: *rln
    command: ["/RLNdata", "--daemon-listening-port", "3001", "--ldk-peer-listening-port", "9735", "--network", "regtest", "--disable-authentication"]
    ports:
      - 127.0.0.1:3001:3001
      - 127.0.0.1:9735:9735
    volumes:
      - rln-alice:/RLNdata
      # B6: lock → backup → unlock writes here; the agent reads it and uploads it to the relay
      - ./data/backups/alice:/backups

  rln-bob:
    <<: *rln
    command: ["/RLNdata", "--daemon-listening-port", "3002", "--ldk-peer-listening-port", "9736", "--network", "regtest", "--disable-authentication"]
    ports:
      - 127.0.0.1:3002:3002
      - 127.0.0.1:9736:9736
    volumes:
      - rln-bob:/RLNdata
      # B6: lock → backup → unlock writes here; the agent reads it and uploads it to the relay
      - ./data/backups/bob:/backups

  rln-charlie:
    <<: *rln
    command: ["/RLNdata", "--daemon-listening-port", "3003", "--ldk-peer-listening-port", "9737", "--network", "regtest", "--disable-authentication"]
    ports:
      - 127.0.0.1:3003:3003
      - 127.0.0.1:9737:9737
    volumes:
      - rln-charlie:/RLNdata
      # B6: lock → backup → unlock writes here; the agent reads it and uploads it to the relay
      - ./data/backups/charlie:/backups

  rln-dave:
    <<: *rln
    command: ["/RLNdata", "--daemon-listening-port", "3004", "--ldk-peer-listening-port", "9738", "--network", "regtest", "--disable-authentication"]
    ports:
      - 127.0.0.1:3004:3004
      - 127.0.0.1:9738:9738
    volumes:
      - rln-dave:/RLNdata
      # B6: lock → backup → unlock writes here; the agent reads it and uploads it to the relay
      - ./data/backups/dave:/backups

  # Step 4 (KITTY_REGISTRY=v2): three Nostr relays (strfry, NIP-01) carry the registry v2
  # events, kind 7345, content encrypted with the trip key. Each phone publishes to all three
  # and reads from all three; they never see the content. Regtest only, ports on 127.0.0.1.
  nostr-1: &nostr
    image: dockurr/strfry:1.1.3
    restart: unless-stopped
    ports:
      - 127.0.0.1:7001:7777
    volumes:
      - ./nostr/strfry.conf:/etc/strfry.conf:ro
      - nostr-1:/app/strfry-db

  nostr-2:
    <<: *nostr
    ports:
      - 127.0.0.1:7002:7777
    volumes:
      - ./nostr/strfry.conf:/etc/strfry.conf:ro
      - nostr-2:/app/strfry-db

  nostr-3:
    <<: *nostr
    ports:
      - 127.0.0.1:7003:7777
    volumes:
      - ./nostr/strfry.conf:/etc/strfry.conf:ro
      - nostr-3:/app/strfry-db

  # demo:lose-phone (SPEC §12, P1): the member's NEW phone, an empty node restored from the
  # backup on the relay. Same ports and the same network name as the lost node, which stays
  # stopped (its data is kept; infra:up refuses to start it again until demo:reset).
  rln-alice-restored:
    <<: *rln
    profiles: [lose-phone]
    command: ["/RLNdata", "--daemon-listening-port", "3001", "--ldk-peer-listening-port", "9735", "--network", "regtest", "--disable-authentication"]
    ports:
      - 127.0.0.1:3001:3001
      - 127.0.0.1:9735:9735
    networks:
      default:
        aliases: [rln-alice]
    volumes:
      - rln-alice-restored:/RLNdata
      - ./data/backups/alice:/backups

  rln-bob-restored:
    <<: *rln
    profiles: [lose-phone]
    command: ["/RLNdata", "--daemon-listening-port", "3002", "--ldk-peer-listening-port", "9736", "--network", "regtest", "--disable-authentication"]
    ports:
      - 127.0.0.1:3002:3002
      - 127.0.0.1:9736:9736
    networks:
      default:
        aliases: [rln-bob]
    volumes:
      - rln-bob-restored:/RLNdata
      - ./data/backups/bob:/backups

  rln-charlie-restored:
    <<: *rln
    profiles: [lose-phone]
    command: ["/RLNdata", "--daemon-listening-port", "3003", "--ldk-peer-listening-port", "9737", "--network", "regtest", "--disable-authentication"]
    ports:
      - 127.0.0.1:3003:3003
      - 127.0.0.1:9737:9737
    networks:
      default:
        aliases: [rln-charlie]
    volumes:
      - rln-charlie-restored:/RLNdata
      - ./data/backups/charlie:/backups

  rln-dave-restored:
    <<: *rln
    profiles: [lose-phone]
    command: ["/RLNdata", "--daemon-listening-port", "3004", "--ldk-peer-listening-port", "9738", "--network", "regtest", "--disable-authentication"]
    ports:
      - 127.0.0.1:3004:3004
      - 127.0.0.1:9738:9738
    networks:
      default:
        aliases: [rln-dave]
    volumes:
      - rln-dave-restored:/RLNdata
      - ./data/backups/dave:/backups

volumes:
  bitcoind:
  electrs:
  esplora:
  rln-alice:
  rln-bob:
  rln-charlie:
  rln-dave:
  rln-alice-restored:
  rln-bob-restored:
  rln-charlie-restored:
  rln-dave-restored:
  nostr-1:
  nostr-2:
  nostr-3:

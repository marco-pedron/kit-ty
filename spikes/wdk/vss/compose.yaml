# Local VSS for the WDK spike, from UTEXO-Protocol/rgb-lightning-node@v0.10.0-beta.3 compose.yaml
# (vss-server built with signature auth). Regtest only, ports on 127.0.0.1.
name: kitty-vss
services:
  vss-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
  vss-server:
    build: { context: ., dockerfile: ./Dockerfile }
    image: vss-server:sigs-auth
    ports:
      - 127.0.0.1:8081:8080
    environment:
      VSS_BIND_ADDRESS: "0.0.0.0:8080"
      VSS_PSQL_USERNAME: postgres
      VSS_PSQL_PASSWORD: postgres
      VSS_PSQL_ADDRESS: "vss-postgres:5432"
      VSS_PSQL_DEFAULT_DB: postgres
      VSS_PSQL_VSS_DB: vss
    depends_on:
      vss-postgres:
        condition: service_healthy
